# Publishes a GitHub Release when a version tag is pushed (PROJECT_PROMPT.md §9–10).
# Create the tag with ./release.ps1, which also bumps Directory.Build.props and the changelog.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the tag matches the version in Directory.Build.props
        shell: pwsh
        run: |
          $version = ./scripts/Get-Version.ps1
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version>. Use ./release.ps1 to create release tags."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build Soundboard.sln -c Release -warnaserror

      - name: Test
        run: dotnet test Soundboard.sln -c Release --no-build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1

      - name: Checksum and release notes
        shell: pwsh
        run: |
          $name = "Soundboard-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "artifacts/$name.sha256" -Encoding ascii
          ./scripts/Get-ReleaseNotes.ps1 -Version $env:VERSION -Sha256 $hash | Set-Content artifacts/release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "Soundboard-Setup-$env:VERSION.exe"
          $ghArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            "artifacts/$name", "artifacts/$name.sha256",
            '--title', "Soundboard $env:VERSION",
            '--notes-file', 'artifacts/release-notes.md',
            '--verify-tag'
          )
          # SemVer pre-releases (1.2.0-rc.1) are marked as such so they are not offered as "latest".
          if ($env:VERSION -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)." }
